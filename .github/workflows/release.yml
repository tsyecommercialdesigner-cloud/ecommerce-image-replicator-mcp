name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version tag matching the validated package
        required: true
        type: string
      main_run_id:
        description: Successful CI run on main containing verified-release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish verified bytes once, preserving existing tags and assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          MAIN_RUN_ID: ${{ inputs.main_run_id }}
        run: python scripts/ci_policy.py publish --tag "$RELEASE_TAG" --run-id "$MAIN_RUN_ID"
