name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.23'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync python scripts/check.py
      - name: Verify released upgrade and rollback preservation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git fetch origin refs/tags/v0.1.1:refs/tags/v0.1.1 refs/tags/v0.1.2:refs/tags/v0.1.2
          if ($LASTEXITCODE -ne 0) { throw 'Release tag fetch failed' }
          uv run --no-sync python scripts/verify_upgrade.py
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade preservation failed' }
      - run: uv run --no-sync pip-audit
      - run: uv build --no-sources
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-${{ matrix.os }}
          path: .cache/validation/
          retention-days: 14
          include-hidden-files: true
